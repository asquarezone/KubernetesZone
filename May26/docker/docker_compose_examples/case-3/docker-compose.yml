---
services:
  store:
    build:
      context: ./store-service
      dockerfile: Dockerfile
    networks:
      - store-network
    ports:
      - "${STORE_PORT:-8082}:8080"
    env_file:
      - stores.env
    depends_on:
      - db
  users:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    networks:
      - store-network
    ports:
      - "${USER_PORT:-8081}:8080"
    env_file:
      - users.env
    depends_on:
      - db
  db:
    image: mysql:8.4
    environment:
      - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-password}"
      - "MYSQL_DATABASE=${MYSQL_DATABASE:-storesdb}"
      - "MYSQL_USER=${MYSQL_USERNAME:-user}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}"
    networks:
      - store-network
    volumes:
      - store-data:/var/lib/mysql

networks:
  store-network:

volumes:
  store-data: