# PodDisruptionBudgets stop the cluster autoscaler from draining a node into
# an outage during scale-down. Remove one and watch scale-down misbehave.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: store-front
  namespace: pets
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: store-front
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  namespace: pets
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
